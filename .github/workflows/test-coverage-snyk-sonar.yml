name: CI - Build, Test & JaCoCo

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write
  pages: write       # para publicar en Pages
  id-token: write    # requerido por deploy-pages

env:
  PROJECT_DIR: .   #cambia si tu pom.xml está en otra carpeta

jobs:
  snyk-scan:
    name: Snyk Security Scan (JSON)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk auth
        run: snyk auth "${SNYK_TOKEN}"

      - name: Snyk test → JSON
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          chmod +x ./mvnw || true
          snyk test \
            --file=pom.xml \
            --package-manager=maven \
            --severity-threshold=high \
            --json-file-output=snyk-report.json

      - name: Snyk summary
        if: always()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sudo apt-get update >/dev/null && sudo apt-get install -y jq >/dev/null
          TOTAL=$(jq '.vulnerabilities | length' snyk-report.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.vulnerabilities[] | select(.severity=="high")] | length' snyk-report.json 2>/dev/null || echo 0)
          MED=$(jq '[.vulnerabilities[] | select(.severity=="medium")] | length' snyk-report.json 2>/dev/null || echo 0)
          LOW=$(jq '[.vulnerabilities[] | select(.severity=="low")] | length' snyk-report.json 2>/dev/null || echo 0)
          {
            echo "### Snyk Summary"
            echo ""
            echo "- Total: **$TOTAL**"
            echo "- High: **$HIGH**"
            echo "- Medium: **$MED**"
            echo "- Low: **$LOW**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: ${{ env.PROJECT_DIR }}/snyk-report.json
          if-no-files-found: warn

  build-test-coverage:
    name: Build, Test & JaCoCo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4 

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Test (with coverage)
        run: mvn -B -U clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/**
            **/target/site/jacoco-aggregate/**
          if-no-files-found: ignore

      - name: Publish JUnit test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/*.xml'
          check_name: 'JUnit Results'
          detailed_summary: true

  sonar-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-test-coverage  # Se ejecuta después del job anterior

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Run SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # Token SonarCloud desde Secrets
        run: |
          mvn -B -U verify sonar:sonar \
            -Dsonar.organization=arkderr \
            -Dsonar.projectKey=ArkDerr_2025TempDevops \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.branch.name=${{ github.ref_name }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

            
 