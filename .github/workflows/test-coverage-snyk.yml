name: CI - Build, Test & JaCoCo

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write
  pages: write       # ⬅️ para publicar en Pages
  id-token: write    # ⬅️ requerido por deploy-pages

jobs:
  # 1) Análisis de seguridad con Snyk (CLI, ejecutando en app/)
  snyk-scan:
    name: Snyk Security Scan (HTML)
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk auth
        run: snyk auth "${SNYK_TOKEN}"

      # Ejecuta Snyk y genera JSON (no rompe el pipeline por vulnerabilidades)
      - name: Snyk test (JSON)
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: |
          # si tienes mvnw en el dir del proyecto, asegúrate de permisos (no hace daño si no existe)
          chmod +x ./mvnw || true
          snyk test \
            --file=pom.xml \
            --package-manager=maven \
            --severity-threshold=high \
            --json > snyk-report.json

      # Convierte JSON → HTML bonito
      - name: Install snyk-to-html
        run: npm install -g snyk-to-html

      - name: Convert JSON to HTML
        working-directory: ${{ env.PROJECT_DIR }}
        run: snyk-to-html -i snyk-report.json -o snyk-report.html

      # Sube el HTML como artefacto descargable del workflow
      - name: Upload Snyk HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: snyk-html-report
          path: ${{ env.PROJECT_DIR }}/snyk-report.html
          if-no-files-found: warn

  publish-snyk-report:
    name: Publish Snyk HTML to GitHub Pages
    needs: snyk-scan
    runs-on: ubuntu-latest
    steps:
      - name: Download Snyk HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: snyk-html-report
          path: ./public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4


  # 2) Pruebas unitarias y cobertura JaCoCo (ejecutando en app/)
  build-test-coverage: # Nombre del job
    runs-on: ubuntu-latest # Corre en una máquina virtual Ubuntu que GitHub te da.
    timeout-minutes: 30 # si tarda más, se cancela automáticamente

    steps:
      - name: Checkout # Clona tu repositorio dentro de la VM. Obligatorio para poder compilar/testear tu código.
        uses: actions/checkout@v4 

      - name: Setup JDK 21 # Instala Java 21 en el runner (en este caso ubuntu-latest).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Ejecuta tus tests con cobertura. Si en el POM tienes el jacoco:check con mínimos,
      # este paso FALLA el job si no se cumple el umbral.
      - name: Build & Test (with coverage)
        run: mvn -B -U clean verify

      # Sube el reporte de cobertura como artefacto descargable desde la ejecución
      - name: Upload JaCoCo report
        if: always()   # lo sube aunque el verify falle, para poder revisar
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/**
            **/target/site/jacoco-aggregate/**
          if-no-files-found: ignore

      # (Opcional) Publica resultados JUnit en la pestaña de Checks
      - name: Publish JUnit test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/*.xml'
          check_name: 'JUnit Results'
          detailed_summary: true
