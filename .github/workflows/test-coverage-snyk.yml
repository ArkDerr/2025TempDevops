name: CI - Build, Test & JaCoCo

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write
  # security-events: write   # ← solo si luego subes SARIF a Code Scanning

jobs:
  # 1) Análisis de seguridad con Snyk (acción oficial)
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Ejecuta Snyk sobre Maven usando la acción oficial
      - name: Snyk Maven test (official action)
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          # No falla el pipeline por vulnerabilidades y genera JSON directo
          args: --severity-threshold=high --json-file-output=snyk-report.json
          sarif: false          # pon true si necesitas SARIF
          monitorWhen: never    # usa 'always' si quieres registrar en dashboard
          failOn: none          # evita fallar el job por vulns

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
          if-no-files-found: warn

  # 2) Pruebas unitarias y cobertura JaCoCo
  build-test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Test (with coverage)
        run: mvn -B -U clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/**
            **/target/site/jacoco-aggregate/**
          if-no-files-found: ignore

      - name: Publish JUnit test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/*.xml'
          check_name: 'JUnit Results'
          detailed_summary: true
