name: CI - Build, Test & JaCoCo

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write
  # security-events: write   # (solo si luego subes SARIF a Code Scanning)

jobs:
  # 1) Análisis de seguridad con Snyk (CLI, ejecutando en app/)
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Instala la CLI de Snyk
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      # Ejecuta Snyk desde la carpeta 'app'
      - name: Snyk test (CLI en app/)
        working-directory: app
        continue-on-error: true
        run: |
          chmod +x ./mvnw || true
          snyk auth "${SNYK_TOKEN}"
          snyk test \
            --file=pom.xml \
            --package-manager=maven \
            --severity-threshold=high \
            --json-file-output=snyk-report.json

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: app/snyk-report.json
          if-no-files-found: warn

  # 2) Pruebas unitarias y cobertura JaCoCo (ejecutando en app/)
  build-test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & Test (with coverage)
        working-directory: app
        run: |
          chmod +x ./mvnw || true
          ./mvnw -B -U clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            app/target/site/jacoco/**
            app/target/site/jacoco-aggregate/**
          if-no-files-found: ignore

      - name: Publish JUnit test results
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'app/target/surefire-reports/*.xml'
          check_name: 'JUnit Results'
          detailed_summary: true
